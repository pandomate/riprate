# Rate-limit login attempts at the edge (backend also rate-limits per IP/user)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    # Security headers (also set by the backend for API responses)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Login endpoint — brute-force protection
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        # $http_host (not $host) keeps the :port so the backend's same-origin
        # CSRF check matches when accessed via a LAN IP / VPN host, not just localhost.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE endpoints — must disable buffering so events reach the browser immediately
    location ~ ^/api/(admin|nav)/stream$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        chunked_transfer_encoding on;
    }

    # Local video playback + save-to-computer + zips — stream large files
    # without buffering the whole response, and pass Range requests through
    # for instant seeking / resumable downloads.
    location ~ ^/api/watch/([0-9]+(/download|/zip|/item-zip|/files/.+)?|(show|season)-zip/.+|show-files/[^/]+/.+)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 3600;
        client_max_body_size 0;
    }

    # Proxy all other API calls to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA catch-all — serve index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
